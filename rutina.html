<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi día — La Liga en español</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="site">
        <h1><span class="ball">☀️</span> Mi día</h1>
        <nav>
          <a href="index.html">Partidos</a>
          <a href="practice.html">Mis frases →</a>
        </nav>
      </header>
      <p class="subtitle">
        Answer about your own day, in the present tense.
      </p>

      <details class="settings" id="settings">
        <summary>Settings — Anthropic API key</summary>
        <div class="row">
          <input
            type="password"
            id="apiKeyInput"
            placeholder="sk-ant-..."
            autocomplete="off"
          />
          <button id="saveKey">Save</button>
          <button class="secondary" id="clearKey">Clear</button>
        </div>
        <div class="key-status" id="keyStatus"></div>
        <p class="hint">
          Stored only in this browser's localStorage and sent directly to the
          Anthropic API when you submit a sentence.
        </p>
      </details>

      <main id="card"></main>
    </div>

    <script type="module" src="js/routine.js"></script>
  </body>
</html>
